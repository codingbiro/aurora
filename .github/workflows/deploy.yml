name: Deploy
# One push to main deploys everything, and only after the tests pass: the Worker (aurora.birovince.com: the dashboard's
# static assets, the /api proxy and the 5-minute cron) with wrangler, and the GitHub Pages mirror.
# The Worker step needs the repository secret CLOUDFLARE_API_TOKEN (a Cloudflare API token made from the "Edit Cloudflare
# Workers" template; `gh secret set CLOUDFLARE_API_TOKEN`). Without it the step is skipped with a notice, and the Worker
# is deployed by hand with `npm run worker:deploy`.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  worker:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Deploy the Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed from CI; npm run worker:deploy deploys it by hand."
  pages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
